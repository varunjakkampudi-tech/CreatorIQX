[project]
name = "creatoriqx-api"
version = "0.1.0"
description = "CreatorIQX API: FastAPI modular monolith (ADR 0001)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "asyncpg==0.32.0",
    "celery==5.6.3",
    "cryptography==50.0.2",
    "fastapi==0.143.0",
    "httpx==0.28.1",
    "prometheus-client==0.26.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "PyJWT[crypto]==2.10.1",
    "redis==8.1.0",
    "sqlalchemy[asyncio]==2.1.4",
    "structlog==26.1.0",
    "uvicorn[standard]==0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"
