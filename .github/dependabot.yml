# Dependabot config (spec §10 Supply chain; backlog P0-102).
# Covers every place a lockfile or pinned version lives in this repo.

version: 2

updates:
  # Python workspace (uv.lock covers apps/api and apps/worker together).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns: ["*"]

  # JS/TS workspace (pnpm-lock.yaml covers apps/web and packages/api-client).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      js-dependencies:
        patterns: ["*"]

  # Dockerfile base images.
  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/apps/worker"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "weekly"

  # Pinned action versions in .github/workflows/*.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
