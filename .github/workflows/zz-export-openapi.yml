name: zz-export-openapi

# Scratch, temporary workflow (see docs/PROGRESS.md "How to run the gates from
# a sandbox without package access"): this sandbox session has no network
# route to PyPI or npm, so it cannot run `python scripts/export_openapi.py`
# or `pnpm --filter @creatoriqx/api-client run generate` locally to
# regenerate the committed OpenAPI document and its generated TS client
# after adding Phase 1C's transcripts/content routes. This workflow does
# both on a real GitHub Actions runner instead and commits the result back
# to this scratch branch only. Delete this file once the regenerated files
# have been picked up on `main` (same pattern as
# chore/export-openapi-scratch, Phase 1B).

on:
  push:
    branches: ["chore/export-openapi-scratch-2"]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install Python dependencies from lockfile
        run: uv sync --all-packages --locked

      - name: Regenerate the OpenAPI document
        run: uv run python scripts/export_openapi.py

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Regenerate the TS client
        run: pnpm --filter @creatoriqx/api-client run generate

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/api-client/openapi.json packages/api-client/src/schema.d.ts
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "chore: regenerate openapi.json and schema.d.ts (scratch, see zz-export-openapi)"
            git push
          fi
