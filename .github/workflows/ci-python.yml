name: ci-python

# Same gates as `dev.py lint` and `dev.py test` locally (spec §12, §17).
# Later tickets add steps here: Postgres and Redis service containers and the
# migration round-trip (P0-040), ERD drift (P0-044), OpenAPI drift (P0-033).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint, types, architecture, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tag is published
        with:
          enable-cache: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies from lockfiles
        run: |
          uv sync --all-packages --locked
          pnpm install --frozen-lockfile

      - name: Lint (Ruff, format, mypy strict, import-linter, Prettier)
        run: uv run python scripts/dev.py lint

      - name: Test with coverage gates (70% overall, 85% domain and application)
        run: uv run python scripts/dev.py test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.json
          if-no-files-found: ignore
