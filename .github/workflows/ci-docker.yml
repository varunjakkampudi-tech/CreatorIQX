name: ci-docker

# Builds the production images for api, worker, web and mcp-server (P0-021,
# P0-070) and proves each one runs as a non-root user, then (P0-022) boots
# the full containerized stack (`dev.py up-full`'s compose profile) and
# proves it actually serves traffic end to end: /healthz, /readyz, the web
# app's "/" and the mcp-server's streamable-http endpoint all answer, and the
# worker answers a Celery ping. The sandbox this project is built in has no
# local Docker daemon, so this workflow is the only place any of this
# actually executes.

on:
  push:
    branches: [main, "ci/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: Build and verify non-root (api, worker, web, mcp-server)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
            image: creatoriqx-api:ci
          - name: worker
            dockerfile: apps/worker/Dockerfile
            image: creatoriqx-worker:ci
          - name: web
            dockerfile: apps/web/Dockerfile
            image: creatoriqx-web:ci
          - name: mcp-server
            dockerfile: apps/mcp-server/Dockerfile
            image: creatoriqx-mcp-server:ci
    steps:
      - uses: actions/checkout@v7

      - name: Build (${{ matrix.name }})
        run: |
          docker build \
            --file ${{ matrix.dockerfile }} \
            --tag ${{ matrix.image }} \
            .

      - name: Verify non-root (id -u is not 0)
        run: |
          uid="$(docker run --rm --entrypoint id ${{ matrix.image }} -u)"
          echo "Container uid: $uid"
          if [ "$uid" = "0" ]; then
            echo "::error::${{ matrix.image }} runs as root (uid 0)"
            exit 1
          fi

      - name: Inspect image size
        run: docker image inspect ${{ matrix.image }} --format '{{ .Size }}' | numfmt --to=iec-i --suffix=B

  full-stack:
    name: Full stack boots, migrates and seeds (P0-022)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tag is published
        with:
          enable-cache: true

      - name: Install Python dependencies from the lockfile (for migrate/seed)
        run: uv sync --package creatoriqx-api --locked

      - name: Start the full profile (postgres, redis, api, worker, web, mcp-server)
        run: |
          cp .env.example .env
          docker compose --env-file .env -f infra/compose/docker-compose.yml \
            --profile full up --detach --build --wait --wait-timeout 180

      - name: Apply migrations (owner role)
        run: uv run python scripts/dev.py migrate

      - name: Seed the second demo workspace
        run: uv run python scripts/dev.py seed

      - name: Smoke-check every service answers
        run: |
          curl -fsS http://127.0.0.1:58000/healthz
          curl -fsS http://127.0.0.1:58000/readyz
          curl -fsS http://127.0.0.1:3000/ | head -c 200
          docker compose --env-file .env -f infra/compose/docker-compose.yml --profile full \
            exec -T worker celery -A \
            creatoriqx_api.modules.jobs.infrastructure.celery_app.celery_app inspect ping
          # mcp-server speaks streamable-http, not plain HTTP: a bare GET is a
          # protocol error (406/400), not a successful response, so prove it is
          # listening with a plain TCP connect - the same check its own
          # Compose healthcheck uses - rather than asserting on a status code.
          timeout 3 bash -c "exec 3<>/dev/tcp/127.0.0.1/58070" && echo "mcp-server: listening on 58070"

      - name: Compose logs (always, for diagnosis)
        if: always()
        run: |
          docker compose --env-file .env -f infra/compose/docker-compose.yml \
            --profile full logs --no-color

      - name: Tear down
        if: always()
        run: docker compose --env-file .env -f infra/compose/docker-compose.yml --profile full down -v
