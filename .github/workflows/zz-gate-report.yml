name: zz-gate-report

# TEMPORARY workflow for resolving uv.lock for P0-060 (new `celery` dependency,
# new `apps/worker` workspace member). Posts `uv lock`'s resulting lockfile as
# chunked PR comments so it can be reconstructed and committed locally - the
# sandbox has no PyPI access to run `uv lock` itself, and a workflow push with
# the default GITHUB_TOKEN leaves the commit action_required-blocked (actor
# github-actions[bot]), so this workflow only ever reports, never pushes.
# Deleted once P0-060 is green.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    name: Resolve uv.lock and report
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Resolve uv.lock (no --locked)
        run: |
          uv lock > /tmp/uvlock_cmd_out.txt 2>&1
          echo "exit: $?" >> /tmp/uvlock_cmd_out.txt

      - name: Chunk uv.lock (and command output) for PR comments
        if: always()
        run: |
          split -b 60000 -d -a 3 uv.lock /tmp/uvlock_part_ 2>/dev/null || true
          split -b 60000 -d -a 3 /tmp/uvlock_cmd_out.txt /tmp/uvlockout_part_ 2>/dev/null || true
          ls -la /tmp/uvlock_part_* /tmp/uvlockout_part_* 2>/dev/null || true

      - name: Post chunks as PR comments
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            let files = [];
            try {
              files = fs.readdirSync('/tmp').filter(
                f => f.startsWith('uvlock_part_') || f.startsWith('uvlockout_part_')
              ).sort();
            } catch (e) {}
            for (const f of files) {
              const content = fs.readFileSync(`/tmp/${f}`, 'utf8');
              const tag = f.startsWith('uvlockout_part_') ? 'UVLOCKCMD' : 'UVLOCK';
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `${tag} ${f}\n\`\`\`\n${content}\n\`\`\``,
              });
            }

      - name: Report lint/test output too
        if: always()
        run: |
          uv sync --all-packages
          pnpm install --no-frozen-lockfile || true
          { uv run python scripts/dev.py lint || true; } > /tmp/lint_out.txt 2>&1
          echo "---TEST---" >> /tmp/lint_out.txt
          cp .env.example .env
          docker compose --env-file .env -f infra/compose/docker-compose.yml up --detach --wait --wait-timeout 120 || true
          { uv run python scripts/dev.py test || true; } >> /tmp/lint_out.txt 2>&1
          echo "---TASKQUEUE VERBOSE---" >> /tmp/lint_out.txt
          {
            uv run pytest tests/integration/test_task_queue.py -v -s --log-cli-level=INFO || true
          } >> /tmp/lint_out.txt 2>&1
          split -b 60000 -d -a 3 /tmp/lint_out.txt /tmp/lintout_part_
          ls /tmp/lintout_part_* || true

      - name: Post lint/test chunks as PR comments
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            let files = [];
            try {
              files = fs.readdirSync('/tmp').filter(f => f.startsWith('lintout_part_')).sort();
            } catch (e) {}
            for (const f of files) {
              const content = fs.readFileSync(`/tmp/${f}`, 'utf8');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `LINTTEST ${f}\n\`\`\`\n${content}\n\`\`\``,
              });
            }
