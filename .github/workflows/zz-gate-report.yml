name: zz-gate-report

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install (capture output, resolve lockfile)
        id: install
        continue-on-error: true
        run: |
          set +e
          pnpm install --no-frozen-lockfile > /tmp/install.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          tail -c 55000 /tmp/install.log > /tmp/install.tail.log

      - name: Fix formatting (root Prettier, every workspace)
        if: always()
        run: pnpm run format > /tmp/format.log 2>&1 || true

      - name: Split resolved lockfile and formatted diffs into PR-comment-sized chunks
        if: always()
        run: |
          set +e
          mkdir -p /tmp/chunks
          cp pnpm-lock.yaml /tmp/chunks/pnpm-lock.yaml
          git diff --stat > /tmp/format.stat.txt
          split -b 60000 -d -a 3 /tmp/chunks/pnpm-lock.yaml /tmp/chunks/lock_part_

      - name: Post install + format summary as PR comment
        if: always()
        run: |
          set +e
          {
            echo "### zz-gate-report: pnpm install (exit ${{ steps.install.outputs.exit }})"
            echo '```'
            cat /tmp/install.tail.log
            echo '```'
            echo "### format --write diffstat"
            echo '```'
            cat /tmp/format.stat.txt
            echo '```'
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Post resolved pnpm-lock.yaml as chunked PR comments
        if: always()
        run: |
          set +e
          for f in /tmp/chunks/lock_part_*; do
            {
              echo "### zz-gate-report: pnpm-lock.yaml chunk $(basename "$f")"
              echo '```yaml'
              cat "$f"
              echo '```'
            } > /tmp/chunk_comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/chunk_comment.md
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Post full formatted-file list + each changed file's new content
        if: always()
        run: |
          set +e
          git diff --name-only -- . ':!pnpm-lock.yaml' > /tmp/format.files.txt
          cat /tmp/format.files.txt
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            split -b 60000 -d -a 3 "$file" "/tmp/chunks/$(echo "$file" | tr '/' '_')_part_"
          done < /tmp/format.files.txt
          for f in /tmp/chunks/*_part_*; do
            case "$f" in */lock_part_*) continue;; esac
            {
              echo "### zz-gate-report: formatted file chunk $(basename "$f")"
              echo '```'
              cat "$f"
              echo '```'
            } > /tmp/chunk_comment2.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/chunk_comment2.md
          done
        env:
          GH_TOKEN: ${{ github.token }}
