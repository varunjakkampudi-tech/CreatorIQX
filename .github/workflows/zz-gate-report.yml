name: zz-gate-report

# Temporary: this sandbox has no npm registry access, so pnpm-lock.yaml
# for apps/web's new dependencies can only be resolved in a networked CI
# runner. Posts the resolved lockfile as PR comments (Actions log and
# artifact blobs are not reachable from here either) in ordered,
# size-bounded parts, since a single comment is capped at 65536 chars.
# Deleted before this PR merges.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install (generates the lockfile)
        run: pnpm install --no-frozen-lockfile

      - name: Run the gates and keep going even if one fails
        run: |
          {
            echo "## Gate results for ${{ github.sha }}"
            echo '```'
            (pnpm run format:check 2>&1; echo "format:check exit=$?")
            (pnpm --filter @creatoriqx/web run lint 2>&1; echo "lint exit=$?")
            (pnpm --filter @creatoriqx/web run typecheck 2>&1; echo "typecheck exit=$?")
            (pnpm --filter @creatoriqx/web run build 2>&1; echo "build exit=$?")
            echo '```'
          } > "$RUNNER_TEMP/gates.md"

      - name: Post the gate results as a PR comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file "$RUNNER_TEMP/gates.md"

      - name: Post the resolved lockfile in ordered parts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          split -b 60000 -d -a 3 pnpm-lock.yaml "$RUNNER_TEMP/lockpart."
          total=$(ls "$RUNNER_TEMP"/lockpart.* | wc -l)
          i=0
          for part in $(ls "$RUNNER_TEMP"/lockpart.* | sort); do
            {
              echo "## pnpm-lock.yaml PART $i of $total (0-indexed) for ${{ github.sha }}"
              echo '```yaml'
              cat "$part"
              echo '```'
            } > "$RUNNER_TEMP/lockcomment.md"
            gh pr comment "${{ github.event.pull_request.number }}" --body-file "$RUNNER_TEMP/lockcomment.md"
            i=$((i + 1))
          done
