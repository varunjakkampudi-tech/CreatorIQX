name: zz-gate-report

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Install Playwright's Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E - CSP (capture output)
        id: e2e
        continue-on-error: true
        working-directory: apps/web
        run: pnpm run test:e2e > /tmp/e2e.log 2>&1; echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Unit tests (capture output)
        id: unit
        continue-on-error: true
        working-directory: apps/web
        run: pnpm run test > /tmp/unit.log 2>&1; echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Build Storybook (capture output)
        id: sb
        continue-on-error: true
        working-directory: apps/web
        run: pnpm run build-storybook > /tmp/sb.log 2>&1; echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Accessibility - axe scan (capture output)
        id: a11y
        continue-on-error: true
        working-directory: apps/web
        run: pnpm run test:a11y > /tmp/a11y.log 2>&1; echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Post results as a PR comment
        if: always()
        run: |
          set +e
          {
            echo "### zz-gate-report"
            echo "- e2e (CSP): exit ${{ steps.e2e.outputs.exit }}"
            echo "- unit (vitest): exit ${{ steps.unit.outputs.exit }}"
            echo "- build-storybook: exit ${{ steps.sb.outputs.exit }}"
            echo "- test:a11y: exit ${{ steps.a11y.outputs.exit }}"
            echo ""
            echo "#### e2e tail"
            echo '```'
            tail -c 15000 /tmp/e2e.log
            echo '```'
            echo "#### unit tail"
            echo '```'
            tail -c 12000 /tmp/unit.log
            echo '```'
          } > /tmp/comment1.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment1.md

          {
            echo "### zz-gate-report (part 2)"
            echo "#### build-storybook tail"
            echo '```'
            tail -c 15000 /tmp/sb.log
            echo '```'
            echo "#### test:a11y tail"
            echo '```'
            tail -c 15000 /tmp/a11y.log
            echo '```'
          } > /tmp/comment2.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment2.md
        env:
          GH_TOKEN: ${{ github.token }}
