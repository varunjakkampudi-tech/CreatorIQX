name: zz-gate-report

# TEMPORARY (P0-053). The build sandbox cannot reach the Python package index,
# and Actions log blobs are unreachable from it too, so the agent cannot read
# CI output. This workflow runs the same gates as ci-python and posts the
# output, plus a patch for the generated files, as a pull request comment.
# DELETE THIS FILE before merging P0-053.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: zz-gate-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Gate report
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies from lockfiles
        run: |
          uv sync --all-packages --locked
          pnpm install --frozen-lockfile

      - name: Start local services (PostgreSQL, Redis)
        run: |
          cp .env.example .env
          docker compose --env-file .env -f infra/compose/docker-compose.yml up --detach --wait --wait-timeout 120

      - name: Run gates and build the report
        run: |
          set +e
          report=report.md
          : > "$report"

          section() {
            name="$1"; shift
            out=$("$@" 2>&1)
            code=$?
            if [ $code -eq 0 ]; then
              printf '### %s: PASS\n\n' "$name" >> "$report"
            else
              printf '### %s: FAIL (exit %s)\n\n```\n%s\n```\n\n' \
                "$name" "$code" "$(printf '%s' "$out" | tail -c 3500)" >> "$report"
            fi
          }

          printf '## Gate report (temporary workflow, P0-053)\n\n' >> "$report"

          section "ruff check"        uv run ruff check .
          section "ruff format"       uv run ruff format --check .
          section "mypy strict"       uv run mypy
          section "import-linter"     uv run lint-imports
          section "prettier"          pnpm run format:check
          section "openapi drift"     uv run python scripts/export_openapi.py --check
          section "erd drift"         uv run python scripts/generate_erd.py --check
          section "pytest"            uv run python scripts/dev.py test

          # Regenerate the generated files and emit a patch the agent can apply.
          uv run python scripts/export_openapi.py  > /dev/null 2>&1
          uv run python scripts/generate_erd.py    > /dev/null 2>&1
          if ! git diff --quiet; then
            printf '### Patch for generated files\n\n```diff\n%s\n```\n\n' \
              "$(git diff | head -c 40000)" >> "$report"
          else
            printf '### Generated files: already in sync\n\n' >> "$report"
          fi

          printf '_Run: %s_\n' "$GITHUB_RUN_ID" >> "$report"
          head -c 60000 "$report" > report.trimmed && mv report.trimmed "$report"
          exit 0

      - name: Post the report as a pull request comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file report.md
