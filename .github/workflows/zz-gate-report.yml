name: zz-gate-report

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Only run on branches of this repo (not forks), since it pushes back to
    # the PR's head branch to resolve pnpm-lock.yaml / Prettier formatting -
    # the sandbox this project is built from cannot reach the npm registry,
    # so this is the only way to get those files resolved. Temporary: delete
    # once P0-083 is green and merged.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install (capture output, resolve lockfile)
        id: install
        continue-on-error: true
        run: |
          set +e
          pnpm install --no-frozen-lockfile > /tmp/install.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          tail -c 55000 /tmp/install.log > /tmp/install.tail.log

      - name: Fix formatting (root Prettier, every workspace)
        if: always()
        run: pnpm run format > /tmp/format.log 2>&1 || true

      - name: Commit and push resolved lockfile / formatting back to the PR branch
        if: always()
        run: |
          set +e
          git config user.name "zz-gate-report[bot]"
          git config user.email "zz-gate-report@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: resolve pnpm-lock.yaml and Prettier formatting (zz-gate-report)"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          else
            echo "nothing to commit"
          fi

      - name: Post install output as PR comment
        if: always()
        run: |
          set +e
          {
            echo "### zz-gate-report: pnpm install (exit ${{ steps.install.outputs.exit }})"
            echo '```'
            cat /tmp/install.tail.log
            echo '```'
            echo "### format (last 4000 bytes)"
            echo '```'
            tail -c 4000 /tmp/format.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md
        env:
          GH_TOKEN: ${{ github.token }}
