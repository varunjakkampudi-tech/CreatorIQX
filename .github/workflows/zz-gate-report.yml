name: zz-gate-report

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install (capture output, resolve lockfile)
        id: install
        continue-on-error: true
        run: |
          set +e
          pnpm install --no-frozen-lockfile > /tmp/install.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          tail -c 55000 /tmp/install.log > /tmp/install.tail.log

      - name: depcruise (capture output)
        id: depcruise
        continue-on-error: true
        working-directory: apps/web
        run: pnpm run depcruise > /tmp/depcruise.log 2>&1; echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: format:check diff (capture output)
        id: fmt
        continue-on-error: true
        run: pnpm run format:check > /tmp/fmt.log 2>&1; echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: lint (capture output)
        id: lint
        continue-on-error: true
        working-directory: apps/web
        run: pnpm run lint > /tmp/lint.log 2>&1; echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Split resolved lockfile into PR-comment-sized chunks
        if: always()
        run: |
          set +e
          mkdir -p /tmp/chunks
          cp pnpm-lock.yaml /tmp/chunks/pnpm-lock.yaml
          split -b 60000 -d -a 3 /tmp/chunks/pnpm-lock.yaml /tmp/chunks/lock_part_

      - name: Post install/depcruise output as PR comment
        if: always()
        run: |
          set +e
          {
            echo "### zz-gate-report: pnpm install (exit ${{ steps.install.outputs.exit }})"
            echo '```'
            cat /tmp/install.tail.log
            echo '```'
            echo "### depcruise (exit ${{ steps.depcruise.outputs.exit }})"
            echo '```'
            tail -c 15000 /tmp/depcruise.log
            echo '```'
            echo "### format:check (exit ${{ steps.fmt.outputs.exit }})"
            echo '```'
            tail -c 15000 /tmp/fmt.log
            echo '```'
            echo "### lint (exit ${{ steps.lint.outputs.exit }})"
            echo '```'
            tail -c 15000 /tmp/lint.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Post resolved pnpm-lock.yaml as chunked PR comments
        if: always()
        run: |
          set +e
          for f in /tmp/chunks/lock_part_*; do
            {
              echo "### zz-gate-report: pnpm-lock.yaml chunk $(basename "$f")"
              echo '```yaml'
              cat "$f"
              echo '```'
            } > /tmp/chunk_comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/chunk_comment.md
          done
        env:
          GH_TOKEN: ${{ github.token }}
