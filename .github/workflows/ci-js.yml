name: ci-js

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-js-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, types, build (apps/web, packages/api-client)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Format check (root Prettier, every workspace)
        run: pnpm run format:check

      - name: Generated API client matches openapi.json (P0-081)
        run: pnpm --filter @creatoriqx/api-client run generate:check

      - name: Typecheck (packages/api-client)
        run: pnpm --filter @creatoriqx/api-client run typecheck

      - name: Lint (apps/web)
        run: pnpm --filter @creatoriqx/web run lint

      - name: Typecheck (apps/web)
        run: pnpm --filter @creatoriqx/web run typecheck

      - name: Build (apps/web)
        run: pnpm --filter @creatoriqx/web run build

      - name: Install Playwright's Chromium (apps/web, P0-082 CSP test)
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E - Content Security Policy nonce (apps/web, P0-082)
        working-directory: apps/web
        run: pnpm run test:e2e

      - name: Unit tests - UI primitives (apps/web, P0-083)
        working-directory: apps/web
        run: pnpm run test

      - name: Build Storybook (apps/web, P0-083)
        working-directory: apps/web
        run: pnpm run build-storybook

      - name: Accessibility - axe scan of every story (apps/web, P0-083)
        working-directory: apps/web
        run: pnpm run test:a11y

      - name: Upload the resolved lockfile (so it can be committed if it drifted)
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
          retention-days: 7

      - name: Fail if the committed lockfile is out of date
        run: git diff --exit-code pnpm-lock.yaml
