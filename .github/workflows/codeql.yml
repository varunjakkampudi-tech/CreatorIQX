name: codeql

# GitHub code scanning (spec §10 Supply chain; backlog P0-102; OQ-09).
# Free for this repo because it is public on a personal account (not an
# organization). Report-only in Phase 0: findings land in the Security tab,
# but this workflow does not fail the build. Becomes a required check from
# Phase 1A once a findings baseline has been triaged.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1" # weekly, Monday 07:00 UTC

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
