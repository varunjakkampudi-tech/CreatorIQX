# CreatorIQX Python workspace root (uv). Not a package itself.
# Members are added as their tickets land: worker (P0-060, done); mcp-server (P0-070).

[project]
name = "creatoriqx-workspace"
version = "0.1.0"
description = "CreatorIQX Python workspace root"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/worker"]

[tool.uv.sources]
creatoriqx-api = { workspace = true }
creatoriqx-worker = { workspace = true }

[dependency-groups]
dev = [
    "asyncpg-stubs==0.32.0",
    "httpx2==2.13.1",
    "import-linter==2.15",
    "mypy==2.4.0",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
]

# --- Ruff: lint and format (spec §12, §17: zero warnings, C901 complexity) ---------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api/src", "apps/api/tests", "apps/worker/src", "apps/worker/tests", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "B",            # bugbear
    "UP",           # pyupgrade
    "S",            # bandit security
    "SIM",          # simplify
    "RUF",          # ruff-specific
    "C90",          # mccabe complexity
    "N",            # naming
    "ANN",          # type annotations
    "PT",           # pytest style
    "TID",          # tidy imports
    "DTZ",          # timezone-aware datetimes
    "BLE",          # no blind except
    "T20",          # no print in app code
    "ERA",          # no commented-out code
    "PLE", "PLW",   # pylint errors and warnings
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]                          # assert is how pytest checks
"scripts/**" = ["T201", "S603", "S607"]
"**/migrations/**" = ["INP001"]  # Alembic dirs are intentionally not packages            # CLI scripts print and run trusted tools
# Integration tests drive the Docker CLI and build SQL only from module constants
"tests/integration/**" = ["S603", "S607", "S608"]

# --- mypy: strict typing (spec §12) ----------------------------------------------
[tool.mypy]
strict = true
python_version = "3.12"
files = ["apps/api/src", "apps/api/tests", "apps/worker/src", "apps/worker/tests", "scripts", "tests"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# Celery ships no py.typed marker and no official stubs (ADR 0003). Rather
# than add and maintain a third-party stub package for Phase 0's one job,
# treat it as untyped at the boundary: ignore_missing_imports silences the
# import-untyped errors, and the one module that decorates with
# `@celery_app.task` is exempted from disallow_untyped_decorators, since an
# Any-typed decorator always trips that check under strict mode.
[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["creatoriqx_api.modules.jobs.infrastructure.tasks"]
disallow_untyped_decorators = false

# --- pytest and coverage (spec §12: 85% domain and application, 70% overall) ------
[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "apps/worker/tests", "tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
asyncio_mode = "auto"
xfail_strict = true
filterwarnings = ["error"]  # deprecations fail the suite so they are fixed early
markers = ["integration: needs local services running (py scripts/dev.py up)"]

[tool.coverage.run]
source = ["creatoriqx_api", "creatoriqx_worker"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

# --- import-linter: architecture boundaries (ADR 0001, spec §17 Architecture) ------
[tool.importlinter]
root_packages = ["creatoriqx_api"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "domain-is-pure"
name = "Domain layers import no frameworks, infrastructure or api"
type = "forbidden"
source_modules = ["creatoriqx_api.modules.*.domain"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
    "alembic",
    "celery",
    "redis",
    "pydantic_settings",
    "httpx",
    "structlog",
    "creatoriqx_api.modules.*.application",
    "creatoriqx_api.modules.*.infrastructure",
    "creatoriqx_api.modules.*.api",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "module-layers"
name = "Within a module: api and infrastructure sit above application, which sits above domain"
type = "layers"
containers = ["creatoriqx_api.modules.*"]
layers = ["(api) | (infrastructure)", "(application)", "(domain)"]  # parentheses: layer may be absent
exhaustive = false

[[tool.importlinter.contracts]]
id = "no-foreign-internals"
name = "No layer imports any module's infrastructure or api except through the composition root"
type = "forbidden"
source_modules = [
    "creatoriqx_api.modules.*.domain",
    "creatoriqx_api.modules.*.application",
    "creatoriqx_api.modules.*.api",
]
forbidden_modules = ["creatoriqx_api.modules.*.infrastructure"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "jobs-celery-boundary"
name = "Only jobs.infrastructure may import Celery (ADR 0003)"
type = "forbidden"
source_modules = [
    "creatoriqx_api.modules.identity",
    "creatoriqx_api.modules.workspaces",
    "creatoriqx_api.modules.audit",
    "creatoriqx_api.modules.telemetry",
    "creatoriqx_api.modules.jobs.domain",
]
forbidden_modules = ["celery"]
allow_indirect_imports = true
