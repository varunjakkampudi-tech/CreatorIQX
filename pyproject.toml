# CreatorIQX Python workspace root (uv). Not a package itself.
# Members are added as their tickets land: worker (P0-060), mcp-server (P0-070).

[project]
name = "creatoriqx-workspace"
version = "0.1.0"
description = "CreatorIQX Python workspace root"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api"]

[tool.uv.sources]
creatoriqx-api = { workspace = true }
